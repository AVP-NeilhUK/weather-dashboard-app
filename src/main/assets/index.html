<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0e14">
<title>Weather Dashboard</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap');

:root {
    --bg-primary: #0a0e14;
    --bg-secondary: #151922;
    --bg-tertiary: #1f2430;
    --text-primary: #e6e6e6;
    --text-secondary: #8a919e;
    --accent-warm: #ff6b6b;
    --accent-cool: #4ecdc4;
    --accent-rain: #6ca0dc;
    --accent-wind: #b39ddb;
    --accent-ice: #9be7ff;
    --accent-sun: #ffd93d;
    --accent-amber: #ff9f1c;
    --accent-red: #ff4d4d;
    --border: #2d3342;
}
[data-theme="light"] {
    --bg-primary: #f8f9fa;
    --bg-secondary: #ffffff;
    --bg-tertiary: #e9ecef;
    --text-primary: #1a1a1a;
    --text-secondary: #6c757d;
    --accent-warm: #dc3545;
    --accent-cool: #20a383;
    --accent-rain: #0d6efd;
    --accent-wind: #6f42c1;
    --accent-ice: #0a8fb3;
    --accent-sun: #b58900;
    --accent-amber: #d9480f;
    --accent-red: #c92a2a;
    --border: #dee2e6;
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }
body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: var(--bg-primary);
    color: var(--text-primary);
    display: flex;
    flex-direction: column;
    height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 10px);
    gap: 10px;
}

/* TOP BAR */
.topbar { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
.loc-wrap { flex: 1; min-width: 0; }
#locationInput {
    width: 100%;
    padding: 8px 10px;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: 6px;
    color: var(--text-primary);
    font: 700 0.95rem 'Nunito', system-ui, sans-serif;
}
#locationInput:focus { outline: none; border-color: var(--accent-cool); }
.icon-btn.on { border-color: var(--accent-cool); box-shadow: inset 0 0 0 1px var(--accent-cool); }
.icon-btn {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: 50%;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    color: var(--text-primary);
    font-size: 1.1rem;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
}

/* CURRENT CONDITIONS */
.current {
    flex-shrink: 0;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: grid;
    grid-template-columns: auto 1fr;
    gap: 14px;
    align-items: center;
}
.cur-main { display: flex; align-items: center; gap: 10px; }
.cur-icon { font-size: 2.2rem; line-height: 1; }
.cur-temp { font-size: 2.1rem; font-weight: 700; line-height: 1; }
.cur-sub { font-size: 0.72rem; color: var(--text-secondary); margin-top: 3px; }
.details { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; }
.detail-label { font-size: 0.6rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-secondary); }
.detail-value { font-size: 0.9rem; font-weight: 700; }
.updated { font-size: 0.65rem; color: var(--text-secondary); grid-column: 1 / -1; margin-top: -6px; }
.updated.error { color: var(--accent-warm); }

/* TABS */
.tabs { display: flex; flex-shrink: 0; border-bottom: 2px solid var(--border); }
.tab {
    flex: 1; padding: 8px 0; text-align: center;
    font-size: 0.72rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-secondary);
    border-bottom: 3px solid transparent; margin-bottom: -2px;
    cursor: pointer; background: none; border-top: none; border-left: none; border-right: none;
    font-family: inherit;
}
.tab.active { color: var(--accent-cool); border-bottom-color: var(--accent-cool); }

/* PAGER */
.pager {
    flex: 1; min-height: 0;
    display: flex;
    overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
    gap: 12px;
}
.pager::-webkit-scrollbar { display: none; }
.page {
    flex: 0 0 100%;
    scroll-snap-align: start;
    scroll-snap-stop: always;
    background: var(--bg-secondary);
    border: 2px solid var(--border);
    border-radius: 6px;
    padding: 10px 12px;
    display: flex; flex-direction: column;
    min-height: 0;
}
.page-title {
    font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
    color: var(--text-secondary); font-weight: 700; margin-bottom: 6px; flex-shrink: 0;
}
.page-body { flex: 1; min-height: 0; overflow-x: hidden; overflow-y: auto; overscroll-behavior-y: contain; overscroll-behavior-x: auto; }

/* ROWS */
.row {
    display: grid;
    align-items: center;
    gap: 8px;
    padding: 7px 0;
    border-bottom: 1px solid var(--border);
    font-size: 0.85rem;
}
.row:last-child { border-bottom: none; }
.row.now { font-weight: 700; }
.hour-row { grid-template-columns: 44px 28px 1fr 36px 62px; }
.alert-row { grid-template-columns: 82px 1fr; }
.day-row { grid-template-columns: 82px 28px 1fr 56px; }
.ico { font-size: 1.15rem; text-align: center; }
.muted { color: var(--text-secondary); }
.warm { color: var(--accent-warm); }
.cool { color: var(--accent-cool); }
.rain { color: var(--accent-rain); }
.right { text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip {
    font-size: 0.72rem; font-weight: 700; line-height: 1;
    padding: 4px 7px; border-radius: 10px;
    border: 1px solid currentColor; white-space: nowrap;
}
.c-rain { color: var(--accent-rain); }
.c-wind { color: var(--accent-wind); }
.c-ice { color: var(--accent-ice); }
.c-fog { color: var(--text-secondary); }
.c-thunder { color: var(--accent-sun); }
.c-snow { color: var(--text-primary); }
.c-heat { color: var(--accent-warm); }
.warnings { margin-bottom: 8px; }
.warn {
    border-left: 4px solid var(--accent-sun);
    background: var(--bg-tertiary);
    border-radius: 4px;
    padding: 7px 9px; margin-bottom: 6px;
    font-size: 0.8rem; line-height: 1.35;
}
.warn.amber { border-left-color: var(--accent-amber); }
.warn.red { border-left-color: var(--accent-red); }
.warn b { display: block; margin-bottom: 2px; }
.warn a { color: var(--accent-cool); font-weight: 700; text-decoration: none; }
.warn-none { font-size: 0.75rem; color: var(--text-secondary); padding: 2px 0 8px; border-bottom: 1px solid var(--border); margin-bottom: 4px; }

/* CHART */
.chart-wrap { flex: 1; min-height: 0; position: relative; }
#weatherChart { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: pan-x; }
.chart-info {
    flex-shrink: 0; min-height: 2.6em; margin-top: 6px; padding-top: 6px;
    border-top: 1px solid var(--border);
    font-size: 0.8rem; color: var(--text-secondary);
}
.legend { display: flex; gap: 12px; font-size: 0.68rem; color: var(--text-secondary); margin-bottom: 4px; flex-shrink: 0; }
.legend i { display: inline-block; width: 10px; height: 3px; vertical-align: middle; margin-right: 4px; }
</style>
</head>
<body data-theme="dark">

<div class="topbar">
    <div class="loc-wrap">
        <input type="text" id="locationInput" placeholder="Enter location..." value="Halesowen" enterkeyhint="search" autocomplete="off">
    </div>
    <button class="icon-btn" id="gpsBtn" aria-label="Use my location">📍</button>
    <button class="icon-btn" id="refreshBtn" aria-label="Refresh">⟳</button>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle theme">🌙</button>
</div>

<div class="current">
    <div>
        <div class="cur-main">
            <div class="cur-icon" id="curIcon">·</div>
            <div class="cur-temp" id="curTemp">--°</div>
        </div>
        <div class="cur-sub" id="curDesc">Loading...</div>
        <div class="cur-sub" id="curPlace"></div>
    </div>
    <div class="details" id="details"></div>
    <div class="updated" id="updateInfo">Loading...</div>
</div>

<div class="tabs" id="tabs">
    <button class="tab active" data-page="0">24 Hour</button>
    <button class="tab" data-page="1">Alerts</button>
    <button class="tab" data-page="2">Chart</button>
    <button class="tab" data-page="3">15 Day</button>
</div>

<div class="pager" id="pager">
    <section class="page">
        <div class="page-title">24 Hour Forecast</div>
        <div class="page-body" id="hourlyForecast">Loading...</div>
    </section>
    <section class="page">
        <div class="page-title">Weather Alerts (All Days)</div>
        <div class="page-body">
            <div class="warnings" id="metWarnings"></div>
            <div id="weatherAlerts">Loading...</div>
        </div>
    </section>
    <section class="page">
        <div class="page-title">Daily Chart</div>
        <div class="legend">
            <span><i style="background: var(--accent-warm)"></i>High</span>
            <span><i style="background: var(--accent-cool)"></i>Low</span>
            <span><i style="background: var(--accent-rain); height: 8px; opacity: 0.5"></i>Rain mm</span>
        </div>
        <div class="chart-wrap"><canvas id="weatherChart"></canvas></div>
        <div class="chart-info" id="chartInfo">Tap a day for details</div>
    </section>
    <section class="page">
        <div class="page-title" id="forecastTitle">15 Day Forecast</div>
        <div class="page-body" id="forecastGrid">Loading...</div>
    </section>
</div>

<script>
let weatherData = null;
let currentLocation = null;
let lastFetch = 0;
let selectedDay = -1;

const store = {
    get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
};

const weatherIcons = {
    0: '☀️', 1: '🌤️', 2: '⛅', 3: '☁️',
    45: '🌫️', 48: '🌫️',
    51: '🌦️', 53: '🌦️', 55: '🌧️',
    61: '🌧️', 63: '🌧️', 65: '🌧️',
    71: '🌨️', 73: '🌨️', 75: '🌨️',
    77: '🌨️', 80: '🌦️', 81: '🌧️', 82: '🌧️',
    85: '🌨️', 86: '🌨️',
    95: '⛈️', 96: '⛈️', 99: '⛈️'
};
const weatherIconsNight = { 0: '🌙', 1: '🌙', 2: '🌛', 3: '☁️' };
const weatherDescriptions = {
    0: 'Clear sky', 1: 'Mainly clear', 2: 'Partly cloudy', 3: 'Overcast',
    45: 'Foggy', 48: 'Rime fog',
    51: 'Light drizzle', 53: 'Moderate drizzle', 55: 'Dense drizzle',
    61: 'Slight rain', 63: 'Moderate rain', 65: 'Heavy rain',
    71: 'Slight snow', 73: 'Moderate snow', 75: 'Heavy snow',
    77: 'Snow grains', 80: 'Slight showers', 81: 'Moderate showers', 82: 'Violent showers',
    85: 'Slight snow showers', 86: 'Heavy snow showers',
    95: 'Thunderstorm', 96: 'Thunder + hail', 99: 'Thunder + heavy hail'
};

// Open-Meteo times are local to the forecast location ("2026-10-22T21:00"),
// so compare them as strings rather than through the phone's clock.
function parseLocalDate(s) {
    const [y, m, d] = s.slice(0, 10).split('-').map(Number);
    return new Date(y, m - 1, d);
}
function dayLabel(i, s) {
    if (i === 0) return 'Today';
    if (i === 1) return 'Tomorrow';
    const d = parseLocalDate(s);
    return d.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + d.getDate();
}

function getIcon(code, timeStr, weather) {
    if (code > 3 || !weather || !weather.daily || !weather.daily.sunrise) return weatherIcons[code] || '☀️';
    const dayIdx = weather.daily.time.indexOf(timeStr.slice(0, 10));
    if (dayIdx === -1) return weatherIcons[code] || '☀️';
    const t = timeStr.slice(0, 16);
    const isNight = t < weather.daily.sunrise[dayIdx].slice(0, 16) || t > weather.daily.sunset[dayIdx].slice(0, 16);
    return isNight ? (weatherIconsNight[code] || '🌙') : (weatherIcons[code] || '☀️');
}

function setStatus(text, isError) {
    const el = document.getElementById('updateInfo');
    el.textContent = text;
    el.classList.toggle('error', !!isError);
}

// Two modes: 'gps' follows the phone's position, 'name' uses the typed place.
// The mode is remembered, so a GPS user gets GPS again on the next launch.
let mode = 'name';
let busy = false;

function setMode(m) {
    mode = m;
    store.set('wd_mode', m);
    document.getElementById('gpsBtn').classList.toggle('on', m === 'gps');
}

function refresh() {
    return mode === 'gps' ? useMyLocation() : searchLocation();
}

async function searchLocation() {
    const input = document.getElementById('locationInput');
    const location = input.value.trim();
    if (!location) return;
    input.blur();
    gpsRun++;
    setMode('name');
    setStatus('Updating...');

    try {
        const locationData = await fetchJSON(
            `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=en&format=json`,
            15000, 'place search'
        );

        if (!locationData.results || !locationData.results[0]) {
            setStatus(`Location "${location}" not found`, true);
            return;
        }

        store.set('wd_location', location);
        await loadWeather(locationData.results[0]);
    } catch (error) {
        setStatus('Could not update: ' + (navigator.onLine === false ? 'no connection' : error.message), true);
    }
}

// Every network call and location request gets a hard time limit, so nothing can hang the app.
function withTimeout(promise, ms, what) {
    let timer;
    return Promise.race([
        promise,
        new Promise((_, reject) => { timer = setTimeout(() => reject(new Error(what + ' timed out')), ms); })
    ]).finally(() => clearTimeout(timer));
}

async function fetchJSON(url, ms = 15000, what = 'download') {
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    try {
        const r = await fetch(url, { signal: ctrl.signal });
        return await r.json();
    } catch (e) {
        throw e.name === 'AbortError' ? new Error(what + ' timed out') : e;
    } finally {
        clearTimeout(timer);
    }
}

function askPosition(highAccuracy, ms) {
    // The phone's own timeout is not always honoured inside the app, so a second limit sits on top
    return withTimeout(new Promise((resolve, reject) => {
        if (!navigator.geolocation) return reject(new Error('location not supported'));
        navigator.geolocation.getCurrentPosition(resolve, reject, {
            enableHighAccuracy: highAccuracy, timeout: ms, maximumAge: 10 * 60 * 1000
        });
    }), ms + 3000, 'location');
}

// Quick rough fix first (phone masts and wifi), then GPS if that fails
async function getPosition() {
    try {
        return await askPosition(false, 8000);
    } catch (e) {
        if (e.code === 1) throw e;   // permission refused: no point asking again
        return await askPosition(true, 15000);
    }
}

// Turns coordinates into a place name. Falls back to the coordinates if the lookup fails.
async function placeName(lat, lon) {
    const fallback = { name: `${lat.toFixed(3)}, ${lon.toFixed(3)}`, country: '' };
    try {
        const r = await fetchJSON(
            `https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguage=en`,
            8000, 'place name'
        );
        const name = r.locality || r.city || r.principalSubdivision;
        return name ? { name, country: r.countryName || '' } : fallback;
    } catch (e) {
        return fallback;
    }
}

function lastKnown() {
    try { return JSON.parse(store.get('wd_lastpos', 'null')); } catch (e) { return null; }
}

let gpsRun = 0;

async function useMyLocation() {
    if (busy) return;
    busy = true;
    const run = ++gpsRun;
    setMode('gps');
    const last = lastKnown();

    try {
        // Show the last known place straight away so the screen is never empty while waiting
        if (!weatherData && last) {
            setStatus('Getting forecast...');
            document.getElementById('locationInput').value = last.name;
            try { await loadWeather(last); } catch (e) {}
        }

        setStatus('Finding your location...');
        const pos = await getPosition();
        if (run !== gpsRun || mode !== 'gps') return;   // user typed a place meanwhile

        const lat = pos.coords.latitude, lon = pos.coords.longitude;
        setStatus('Looking up place name...');
        const place = await placeName(lat, lon);
        if (run !== gpsRun || mode !== 'gps') return;

        const loc = { latitude: lat, longitude: lon, name: place.name, country: place.country };
        document.getElementById('locationInput').value = place.name;
        setStatus('Getting forecast...');
        await loadWeather(loc);
        store.set('wd_lastpos', JSON.stringify(loc));
    } catch (error) {
        if (run !== gpsRun || mode !== 'gps') return;
        const msg = error.code === 1 ? 'location permission refused'
                  : error.code === 2 ? 'location unavailable (is it switched on?)'
                  : error.code === 3 ? 'location timed out'
                  : (navigator.onLine === false ? 'no connection' : error.message);
        const shown = weatherData && currentLocation ? ` · showing ${currentLocation.name}` : '';
        setStatus(`Could not update: ${msg}${shown}. Tap 📍 to retry`, true);
    } finally {
        busy = false;
    }
}

async function loadWeather(loc) {
    // 16 days requested so there are 15 complete ones even when the last day isn't filled in yet
    const weather = await fetchJSON(
        `https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&current=temperature_2m,relative_humidity_2m,apparent_temperature,weather_code,surface_pressure,wind_speed_10m&hourly=temperature_2m,weather_code,relative_humidity_2m,wind_speed_10m,wind_gusts_10m,snowfall&daily=temperature_2m_max,temperature_2m_min,weather_code,precipitation_sum,rain_sum,showers_sum,snowfall_sum,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=16`,
        15000, 'forecast'
    );

    if (!weather.current) throw new Error(weather.reason || 'Bad response');

    currentLocation = loc;
    weatherData = weather;
    lastFetch = Date.now();
    updateUI(weather, loc);
    updateWarnings(loc);   // runs in the background; never holds up the forecast
}

// Number of days with real high and low figures, up to 15.
// The last forecast day is sometimes blank until the next model run.
function numDays(weather) {
    const d = weather.daily;
    let n = 0;
    while (n < 15 && n < d.time.length && d.temperature_2m_max[n] != null && d.temperature_2m_min[n] != null) n++;
    return n;
}

function updateUI(weather, location) {
    updateCurrent(weather, location);
    updateHourly(weather);
    updateAlerts(weather);
    updateForecast(weather);
    drawChart();
    updateChartInfo();
    const timeStr = new Date().toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
    setStatus(`Updated ${timeStr} · auto-refresh every 10 min`);
}

function updateCurrent(weather, location) {
    const c = weather.current;
    document.getElementById('curIcon').textContent = getIcon(c.weather_code, c.time, weather);
    document.getElementById('curTemp').textContent = Math.round(c.temperature_2m) + '°C';
    document.getElementById('curDesc').textContent = weatherDescriptions[c.weather_code] || 'Unknown';
    document.getElementById('curPlace').textContent = `${location.name}, ${location.country || ''}`;
    document.getElementById('details').innerHTML = `
        <div><div class="detail-label">Feels Like</div><div class="detail-value">${Math.round(c.apparent_temperature)}°C</div></div>
        <div><div class="detail-label">Humidity</div><div class="detail-value">${c.relative_humidity_2m}%</div></div>
        <div><div class="detail-label">Wind</div><div class="detail-value">${Math.round(c.wind_speed_10m)} km/h</div></div>
        <div><div class="detail-label">Pressure</div><div class="detail-value">${Math.round(c.surface_pressure)} hPa</div></div>
    `;
}

function updateHourly(weather) {
    const hourly = weather.hourly;
    const nowHour = weather.current.time.slice(0, 13);
    let startIndex = hourly.time.findIndex(t => t.slice(0, 13) === nowHour);
    if (startIndex < 0) startIndex = 0;

    let html = '';
    for (let i = 0; i < 24 && (startIndex + i) < hourly.time.length; i++) {
        const idx = startIndex + i;
        const t = hourly.time[idx];
        const temp = hourly.temperature_2m[idx];
        html += `
            <div class="row hour-row${i === 0 ? ' now' : ''}">
                <div>${t.slice(11, 16)}</div>
                <div class="ico">${getIcon(hourly.weather_code[idx], t, weather)}</div>
                <div>${weatherDescriptions[hourly.weather_code[idx]] || 'Unknown'}</div>
                <div class="${temp > 15 ? 'warm' : 'cool'}">${Math.round(temp)}°</div>
                <div class="muted right">${Math.round(hourly.wind_speed_10m[idx])} km/h</div>
            </div>`;
    }
    document.getElementById('hourlyForecast').innerHTML = html;
}

// Alert thresholds. Wind in km/h (gusts), temperatures in °C, snow in cm, rain in mm.
const ALERT = {
    windy: 60, gale: 80,          // gusts: about 37 mph and 50 mph
    frost: 0, hardFrost: -4,
    hot: 27, veryHot: 32,
    snow: 0.5, heavySnow: 5,
    heavyRain: 10
};

// Works out each day's alerts from the forecast. Today only counts the hours still to come.
function dayAlerts(weather, i) {
    const daily = weather.daily, hourly = weather.hourly;
    const day = daily.time[i];
    const nowHour = weather.current.time.slice(0, 13);
    const list = [];

    let gust = 0, tMin = Infinity, tMax = -Infinity, snow = 0;
    let fog = false, thunder = false, freezing = false, rainCode = false, heavyCode = false;
    for (let h = 0; h < hourly.time.length; h++) {
        const t = hourly.time[h];
        if (t.slice(0, 10) !== day) continue;
        if (i === 0 && t.slice(0, 13) < nowHour) continue;
        const code = hourly.weather_code[h];
        gust = Math.max(gust, hourly.wind_gusts_10m?.[h] ?? 0);
        if (hourly.temperature_2m[h] != null) {
            tMin = Math.min(tMin, hourly.temperature_2m[h]);
            tMax = Math.max(tMax, hourly.temperature_2m[h]);
        }
        snow += hourly.snowfall?.[h] ?? 0;
        if (code === 45 || code === 48) fog = true;
        if (code >= 95) thunder = true;
        if ([56, 57, 66, 67].includes(code)) freezing = true;
        if ((code >= 51 && code <= 67) || (code >= 80 && code <= 82)) rainCode = true;
        if (code === 65 || code === 67 || code === 82) heavyCode = true;
    }
    if (tMin === Infinity) {   // no hourly data left for this day: fall back to the daily figures
        tMin = daily.temperature_2m_min[i];
        tMax = daily.temperature_2m_max[i];
        snow = daily.snowfall_sum?.[i] ?? 0;
    }

    // Rain (snow no longer counts as rain)
    const prob = Math.round(daily.precipitation_probability_max?.[i] ?? 0);
    const rainMm = (daily.rain_sum?.[i] ?? 0) + (daily.showers_sum?.[i] ?? 0);
    if (i === 0) {
        if (heavyCode && prob > 50) list.push(['c-rain', `Heavy rain ${prob}%`]);
        else if ((rainCode && prob > 50) || (prob > 70 && snow < ALERT.snow)) list.push(['c-rain', `Rain ${prob}%`]);
    } else {
        if (rainMm > ALERT.heavyRain) list.push(['c-rain', `Heavy rain ${Math.round(rainMm)}mm`]);
        else if (prob > 50 && rainMm > 0) list.push(['c-rain', `Rain ${prob}%`]);
    }

    if (freezing) list.push(['c-ice', 'Freezing rain']);
    if (snow >= ALERT.heavySnow) list.push(['c-snow', `Heavy snow ${Math.round(snow)}cm`]);
    else if (snow >= ALERT.snow) list.push(['c-snow', `Snow ${snow.toFixed(1)}cm`]);
    if (thunder) list.push(['c-thunder', 'Thunder']);
    if (gust >= ALERT.gale) list.push(['c-wind', `Gales ${Math.round(gust)} km/h`]);
    else if (gust >= ALERT.windy) list.push(['c-wind', `Gusts ${Math.round(gust)} km/h`]);
    if (tMin <= ALERT.hardFrost) list.push(['c-ice', `Hard frost ${Math.round(tMin)}°`]);
    else if (tMin <= ALERT.frost) list.push(['c-ice', `Frost ${Math.round(tMin)}°`]);
    if (fog) list.push(['c-fog', 'Fog']);
    if (tMax >= ALERT.veryHot) list.push(['c-heat', `Very hot ${Math.round(tMax)}°`]);
    else if (tMax >= ALERT.hot) list.push(['c-heat', `Hot ${Math.round(tMax)}°`]);
    return list;
}

function updateAlerts(weather) {
    const daily = weather.daily;
    const maxDays = numDays(weather);
    let html = '';
    for (let i = 0; i < maxDays; i++) {
        const list = dayAlerts(weather, i);
        const chips = list.length
            ? `<div class="chips">${list.map(([c, t]) => `<span class="chip ${c}">${t}</span>`).join('')}</div>`
            : '<span class="muted">-</span>';
        html += `
            <div class="row alert-row${i === 0 ? ' now' : ''}">
                <div style="font-weight: 700">${dayLabel(i, daily.time[i])}</div>
                ${chips}
            </div>`;
    }
    document.getElementById('weatherAlerts').innerHTML = html;
}

// Nearest reference town decides the region. Returns null outside the UK.
function metRegion(lat, lon) {
    let best = null, bestD = Infinity;
    const k = Math.cos(lat * Math.PI / 180);
    for (const [tl, tn, r] of MET_TOWNS) {
        const dy = (lat - tl) * 111, dx = (lon - tn) * 111 * k;
        const d = dx * dx + dy * dy;
        if (d < bestD) { bestD = d; best = r; }
    }
    return Math.sqrt(bestD) <= 90 ? best : null;
}

// Inside the Android app the feed is fetched by the app itself, because the Met Office
// site does not allow web pages on other sites to read it directly.
const bridgeWaits = {};
let bridgeId = 0;
window.__bridgeDone = (id, ok, text) => {
    const w = bridgeWaits[id];
    if (!w) return;
    delete bridgeWaits[id];
    ok ? w.resolve(text) : w.reject(new Error(text || 'download failed'));
};
function fetchText(url, ms) {
    if (window.AVPBridge && window.AVPBridge.fetchText) {
        return withTimeout(new Promise((resolve, reject) => {
            const id = 'r' + (++bridgeId);
            bridgeWaits[id] = { resolve, reject };
            window.AVPBridge.fetchText(id, url);
        }), ms, 'warnings');
    }
    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), ms);
    return fetch(url, { signal: ctrl.signal }).then(r => r.text()).finally(() => clearTimeout(timer));
}

function escapeHtml(t) {
    return String(t).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function updateWarnings(loc) {
    const box = document.getElementById('metWarnings');
    const region = metRegion(loc.latitude, loc.longitude);
    if (!region) { box.innerHTML = ''; return; }
    const name = MET_REGIONS[region];
    try {
        const xml = await fetchText(`https://weather.metoffice.gov.uk/public/data/PWSCache/WarningsRSS/Region/${region}`, 12000);
        const doc = new DOMParser().parseFromString(xml, 'text/xml');
        if (doc.querySelector('parsererror') || !doc.querySelector('channel')) throw new Error('unreadable feed');
        const items = [...doc.querySelectorAll('item')].map(it => ({
            title: it.querySelector('title')?.textContent.trim() || 'Weather warning',
            link: it.querySelector('link')?.textContent.trim() || 'https://weather.metoffice.gov.uk/warnings-and-advice/uk-warnings',
            desc: it.querySelector('description')?.textContent.trim() || ''
        }));
        if (!items.length) {
            box.innerHTML = `<div class="warn-none">No Met Office warnings for ${escapeHtml(name)}</div>`;
            return;
        }
        box.innerHTML = items.map(w => {
            const text = (w.title + ' ' + w.desc).toLowerCase();
            const level = text.includes('red warning') ? 'red' : text.includes('amber warning') ? 'amber' : '';
            const desc = w.desc.replace(/^.*?affecting[^:]*:\s*/i, '');
            return `<div class="warn ${level}">
                <b>⚠ ${escapeHtml(w.title)}</b>
                ${desc ? escapeHtml(desc) + '<br>' : ''}
                <a href="${escapeHtml(w.link)}" target="_blank" rel="noopener">Full warning at Met Office ›</a>
            </div>`;
        }).join('') + `<div class="warn-none">Official warnings for ${escapeHtml(name)} · Source: Met Office</div>`;
    } catch (e) {
        box.innerHTML = `<div class="warn-none">Met Office warnings unavailable (${escapeHtml(e.message)})</div>`;
    }
}

}

// Chart runs top to bottom (one day per row) to suit a tall phone page.
// Temperature runs left (colder) to right (warmer); rain bars sit in their own column, longer = wetter.
function drawChart() {
    if (!weatherData) return;
    const canvas = document.getElementById('weatherChart');
    const rect = canvas.getBoundingClientRect();
    if (rect.width === 0 || rect.height === 0) return;
    const dpr = window.devicePixelRatio || 1;
    canvas.width = rect.width * dpr;
    canvas.height = rect.height * dpr;
    const ctx = canvas.getContext('2d');
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    const W = rect.width, H = rect.height;
    const daily = weatherData.daily;
    const days = numDays(weatherData);
    const style = getComputedStyle(document.body);
    const col = n => style.getPropertyValue(n).trim();
    const warm = col('--accent-warm'), cool = col('--accent-cool'), rain = col('--accent-rain');
    const muted = col('--text-secondary'), text = col('--text-primary'), border = col('--border');

    // Rain gets its own column so bars never sit under the temperature labels
    const rainW = 42;
    const pad = { top: 6, bottom: 6, left: 74 + rainW + 8, right: 30 };
    const plotW = W - pad.left - pad.right;
    const rowH = (H - pad.top - pad.bottom) / days;
    const rowY = i => pad.top + rowH * (i + 0.5);

    const temps = [...daily.temperature_2m_max.slice(0, days), ...daily.temperature_2m_min.slice(0, days)];
    const minT = Math.floor(Math.min(...temps) - 1);
    const maxT = Math.ceil(Math.max(...temps) + 1);
    const tx = t => pad.left + 22 + ((t - minT) / (maxT - minT)) * (plotW - 44);

    const precip = (daily.precipitation_sum ?? []).slice(0, days).map(v => v ?? 0);
    const maxP = Math.max(1, ...precip);

    for (let i = 0; i < days; i++) {
        const y = rowY(i);
        if (i === selectedDay) {
            ctx.fillStyle = border;
            ctx.fillRect(0, y - rowH / 2, W, rowH);
        }
        // rain bar
        if (precip[i] > 0) {
            ctx.globalAlpha = 0.5;
            ctx.fillStyle = rain;
            const bw = Math.max(2, (precip[i] / maxP) * rainW);
            ctx.fillRect(74, y - rowH * 0.3, bw, rowH * 0.6);
            ctx.globalAlpha = 1;
        }
        // day label + icon
        ctx.textBaseline = 'middle';
        ctx.textAlign = 'left';
        ctx.fillStyle = i === 0 ? text : muted;
        ctx.font = `${i === 0 ? 700 : 400} 12px Nunito, system-ui, sans-serif`;
        const d = parseLocalDate(daily.time[i]);
        ctx.fillText(i === 0 ? 'Today' : d.toLocaleDateString('en-GB', { weekday: 'short' }) + ' ' + d.getDate(), 0, y);
        ctx.font = '15px sans-serif';
        ctx.fillText(weatherIcons[daily.weather_code[i]] || '☀️', 48, y);
    }

    function line(arr, colour) {
        ctx.strokeStyle = colour;
        ctx.lineWidth = 2;
        ctx.beginPath();
        for (let i = 0; i < days; i++) {
            const x = tx(arr[i]), y = rowY(i);
            i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        ctx.stroke();
        ctx.fillStyle = colour;
        for (let i = 0; i < days; i++) {
            ctx.beginPath();
            ctx.arc(tx(arr[i]), rowY(i), 2.5, 0, Math.PI * 2);
            ctx.fill();
        }
    }
    line(daily.temperature_2m_min, cool);
    line(daily.temperature_2m_max, warm);

    ctx.font = '700 11px Nunito, system-ui, sans-serif';
    ctx.textBaseline = 'middle';
    for (let i = 0; i < days; i++) {
        const y = rowY(i);
        ctx.fillStyle = cool;
        ctx.textAlign = 'right';
        ctx.fillText(Math.round(daily.temperature_2m_min[i]) + '°', tx(daily.temperature_2m_min[i]) - 6, y);
        ctx.fillStyle = warm;
        ctx.textAlign = 'left';
        ctx.fillText(Math.round(daily.temperature_2m_max[i]) + '°', tx(daily.temperature_2m_max[i]) + 6, y);
    }

    canvas.chartGeom = { pad, rowH, days };
}

function updateChartInfo() {
    const el = document.getElementById('chartInfo');
    if (!weatherData || selectedDay < 0) { el.textContent = 'Tap a day for details'; return; }
    const d = weatherData.daily, i = selectedDay;
    const prob = d.precipitation_probability_max ? (d.precipitation_probability_max[i] ?? 0) : 0;
    el.innerHTML = `<b style="color: var(--text-primary)">${parseLocalDate(d.time[i]).toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'short' })}</b> · ${weatherDescriptions[d.weather_code[i]] || 'Unknown'}<br>
        <span class="warm">${Math.round(d.temperature_2m_max[i])}°</span> / <span class="cool">${Math.round(d.temperature_2m_min[i])}°</span> · <span class="rain">Rain ${((d.precipitation_sum ?? [])[i] ?? 0).toFixed(1)}mm (${Math.round(prob)}%)</span>`;
}

document.getElementById('weatherChart').addEventListener('click', e => {
    const canvas = e.currentTarget;
    if (!canvas.chartGeom) return;
    const { pad, rowH, days } = canvas.chartGeom;
    const y = e.clientY - canvas.getBoundingClientRect().top;
    const i = Math.floor((y - pad.top) / rowH);
    if (i < 0 || i >= days) return;
    selectedDay = (selectedDay === i) ? -1 : i;
    drawChart();
    updateChartInfo();
});

/* PAGER + TABS */
const pager = document.getElementById('pager');
const tabs = [...document.querySelectorAll('.tab')];
function pageWidth() { return pager.clientWidth + 12; }
function setActiveTab(n) { tabs.forEach((t, i) => t.classList.toggle('active', i === n)); }
tabs.forEach(t => t.addEventListener('click', () => {
    pager.scrollTo({ left: Number(t.dataset.page) * pageWidth(), behavior: 'smooth' });
}));
let scrollTimer;
pager.addEventListener('scroll', () => {
    const n = Math.round(pager.scrollLeft / pageWidth());
    setActiveTab(n);
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(() => {
        store.set('wd_page', n);
        if (n === 2) drawChart();
    }, 150);
}, { passive: true });

/* THEME */
function applyTheme(theme) {
    document.body.setAttribute('data-theme', theme);
    document.getElementById('themeBtn').textContent = theme === 'dark' ? '🌙' : '☀️';
    document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0a0e14' : '#f8f9fa');
    store.set('wd_theme', theme);
    drawChart();
}
document.getElementById('themeBtn').addEventListener('click', () => {
    applyTheme(document.body.getAttribute('data-theme') === 'dark' ? 'light' : 'dark');
});

/* CONTROLS */
document.getElementById('refreshBtn').addEventListener('click', refresh);
document.getElementById('gpsBtn').addEventListener('click', useMyLocation);
document.getElementById('locationInput').addEventListener('keydown', e => { if (e.key === 'Enter') searchLocation(); });
document.getElementById('locationInput').addEventListener('focus', e => e.target.select());

window.addEventListener('resize', () => {
    const n = Number(store.get('wd_page', 0));
    pager.scrollLeft = n * pageWidth();
    drawChart();
});

// Refresh when the app comes back to the foreground if the data is stale
document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastFetch > 10 * 60 * 1000) refresh();
});
window.addEventListener('online', refresh);
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 10 * 60 * 1000);

/* STARTUP */
applyTheme(store.get('wd_theme', 'dark'));
document.getElementById('locationInput').value = store.get('wd_location', 'Halesowen');
requestAnimationFrame(() => {
    const n = Number(store.get('wd_page', 0));
    pager.scrollLeft = n * pageWidth();
    setActiveTab(n);
});
setMode(store.get('wd_mode', 'name'));
refresh();
